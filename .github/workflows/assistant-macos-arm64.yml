name: Assistant Mac Apple Silicon release

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact private Assistant source commit
        required: true
        default: cbf828ddf46e876f92d6844b4e518d3e4b713762
        type: string
      inputs_tag:
        description: Private release containing macos-build-inputs.tar.gz
        required: true
        default: release-inputs-v017-cbf828dd-78baef96
        type: string
      inputs_sha256:
        description: SHA-256 of the private build inputs
        required: true
        default: a63d0a1aa0af8f31fd36469da4f5418685f39ab3a59560205a2fead33e41ba7b
        type: string

permissions:
  contents: read

concurrency:
  group: assistant-macos-arm64
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Validate inputs and source credential
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          INPUTS_TAG: ${{ inputs.inputs_tag }}
          INPUTS_SHA256: ${{ inputs.inputs_sha256 }}
          SOURCE_TOKEN: ${{ secrets.ASSISTANT_SOURCE_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$INPUTS_TAG" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$INPUTS_SHA256" =~ ^[a-f0-9]{64}$ ]]
          if [[ -z "$SOURCE_TOKEN" ]]; then
            echo "::error::Add the ASSISTANT_SOURCE_READ_TOKEN repository secret."
            exit 1
          fi
      - name: Checkout private source for this job only
        uses: actions/checkout@v4
        with:
          repository: xyljobs/creditsplan-assistant
          ref: ${{ inputs.source_commit }}
          token: ${{ secrets.ASSISTANT_SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt
      - name: Download and verify private build inputs
        working-directory: private-source
        env:
          GH_TOKEN: ${{ secrets.ASSISTANT_SOURCE_READ_TOKEN }}
          INPUTS_TAG: ${{ inputs.inputs_tag }}
          INPUTS_SHA256: ${{ inputs.inputs_sha256 }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_COMMIT" ]]
          mkdir -p tmp/macos-inputs tmp/private-logs
          gh release download "$INPUTS_TAG" --repo xyljobs/creditsplan-assistant --pattern macos-build-inputs.tar.gz --dir tmp/macos-inputs
          printf '%s  %s\n' "$INPUTS_SHA256" tmp/macos-inputs/macos-build-inputs.tar.gz | shasum -a 256 -c -
          python3 - <<'PY'
          import pathlib, tarfile
          with tarfile.open('tmp/macos-inputs/macos-build-inputs.tar.gz') as archive:
              for member in archive.getmembers():
                  p = pathlib.PurePosixPath(member.name)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert p.parts and p.parts[0] in ('frontend-dist', 'licenses')
                  assert member.isfile() or member.isdir()
              archive.extractall('tmp/macos-inputs', filter='data')
          PY
          mv tmp/macos-inputs/frontend-dist frontend-dist
          node scripts/prepare-macos-bundle.mjs
      - name: Install locked build tools
        working-directory: private-source
        run: |
          set -euo pipefail
          npm ci > tmp/private-logs/npm-install.log 2>&1 || { echo "::error::Locked build-tool installation failed."; exit 1; }
      - name: Native release tests
        working-directory: private-source
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml --check > tmp/private-logs/rustfmt.log 2>&1 || { echo "::error::Native formatting check failed."; exit 1; }
          cargo test --manifest-path src-tauri/Cargo.toml --release --lib --locked > tmp/private-logs/native-tests.log 2>&1 || { echo "::error::Native release tests failed. Private diagnostics are not uploaded."; exit 1; }
          python3 - <<'PY'
          import pathlib, re
          log = pathlib.Path('tmp/private-logs/native-tests.log').read_text()
          result = re.search(r'test result: ok\. (\d+) passed; 0 failed; (\d+) ignored;', log)
          assert result, 'Native test result is missing'
          required = [
              'launcher::target::tests::only_local_absolute_drive_paths_to_an_exe_are_accepted',
              'launcher::tests::a_ready_row_wins_over_a_stale_duplicate_of_the_same_target',
              'launcher::tests::a_record_that_cannot_be_verified_is_not_launched',
              'launcher::tests::cached_list_does_not_rescan_and_carries_no_path',
              'tests::workspace_owner_is_forwarded_separately_from_resource_owner',
          ]
          assert all(f'test {name} ... ok' in log for name in required), 'Required platform and transport tests did not pass'
          print(f'Native tests: {result[1]} passed, 0 failed, {result[2]} existing ignored. All original platform failures passed.')
          PY
      - name: Build Apple Silicon DMG
        working-directory: private-source
        run: |
          set -euo pipefail
          npm run tauri -- build --target aarch64-apple-darwin --bundles app,dmg --config tmp/macos-bundle-config.json --ci -- --locked > tmp/private-logs/macos-build.log 2>&1 || { echo "::error::Apple Silicon packaging failed. Private compiler diagnostics are not uploaded."; exit 1; }
      - name: Verify package and native startup
        working-directory: private-source
        run: |
          set -euo pipefail
          python3 scripts/verify-macos-package.py --target aarch64-apple-darwin --architecture arm64 > tmp/private-logs/package-check.log 2>&1 || { echo "::error::DMG or native startup verification failed."; exit 1; }
          cat tmp/macos-release/release-manifest-macos-arm64.json
      - name: Upload verified installer and release materials
        uses: actions/upload-artifact@v4
        with:
          name: creditsplan-assistant-macos-arm64
          path: |
            private-source/tmp/macos-release/CreditsPlan-Assistant-macos-arm64.dmg
            private-source/tmp/macos-release/release-manifest-macos-arm64.json
            private-source/tmp/macos-release/THIRD_PARTY_LICENSES.txt
            private-source/tmp/macos-release/THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 7
      - name: Upload startup screenshot
        uses: actions/upload-artifact@v4
        with:
          name: macos-startup-evidence-arm64
          path: private-source/tmp/macos-startup.png
          if-no-files-found: ignore
          retention-days: 3
